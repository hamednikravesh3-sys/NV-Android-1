name: Smart Storage APK

on:
  push:
    branches: [chatgpt-smart-storage-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: chatgpt-smartstorage
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Stage APK
        run: cp chatgpt-smartstorage/app/build/outputs/apk/debug/app-debug.apk SmartStorage-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartStorage-APK
          path: SmartStorage-debug.apk
          if-no-files-found: error
          retention-days: 7
